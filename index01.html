<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>今天不搭電梯</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- 遊戲封面 -->
    <div class="cover-screen" id="cover-screen">
      <img src="./img/cover.gif" class="cover-background" alt="遊戲封面" />

      <button class="start-button" id="start-button">
        <img src="./img/buttonStart_01.png" alt="開始遊戲" />
      </button>
    </div>
    <div class="game-container">
      <!-- 結尾頁面（暫時空白，之後放入組員影片） -->
      <div class="ending-screen" id="ending-screen"></div>
      <div class="game-screen">
        <!-- 金幣世界圖層 -->
        <div class="coin-layer"></div>
        <!-- 飛機事件圖層 -->
        <div class="plane-layer"></div>
        <!-- 玩家角色 -->
        <div class="player"></div>
        <!-- 金幣計數器 -->
        <div class="coin-counter">
          金幣：<span id="coin-count">0</span> / 100
        </div>
      </div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
